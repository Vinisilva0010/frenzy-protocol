name: Institutional Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl --retry 5 --retry-delay 3 -sSfL https://release.anza.xyz/v1.18.18/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          mkdir -p /home/runner/.config/solana
          /home/runner/.local/share/solana/install/active_release/bin/solana-keygen new --no-bip39-passphrase -o /home/runner/.config/solana/id.json

      - name: Install Anchor CLI 1.0.0 via Official Binary
        run: |
          URL="https://github.com/coral-xyz/anchor/releases/download/v1.0.0/anchor-cli-x86_64-unknown-linux-gnu.tar.gz"
          curl -L "$URL" -o anchor.tar.gz
          tar -xzf anchor.tar.gz
          sudo mv anchor-cli-x86_64-unknown-linux-gnu/anchor /usr/local/bin/
          sudo chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Install Node Dependencies
        run: npm install
        working-directory: ./frenzy-contracts

      - name: Run Static Security Analysis
        run: cargo clippy --all-targets
        working-directory: ./frenzy-contracts

      - name: Run Adversarial Test Suite
        run: anchor test
        working-directory: ./frenzy-contracts