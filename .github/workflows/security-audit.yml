name: Institutional Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.2/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor AVM
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force && avm install latest && avm use latest

      - name: Install Node Dependencies
        run: npm install
        working-directory: ./frenzy-contracts

      - name: Run Static Security Analysis
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./frenzy-contracts

      - name: Run Adversarial Test Suite
        run: anchor test
        working-directory: ./frenzy-contracts