name: Institutional Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl --retry 5 --retry-delay 3 -sSfL https://release.anza.xyz/v1.18.18/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          mkdir -p /home/runner/.config/solana
          /home/runner/.local/share/solana/install/active_release/bin/solana-keygen new --no-bip39-passphrase -o /home/runner/.config/solana/id.json

      - name: Install AVM and Download Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install 1.0.0
          avm use 1.0.0
          echo "/home/runner/.avm/bin" >> $GITHUB_PATH

      - name: Fix Lockfile and Install Node Dependencies
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          npm install
        working-directory: ./frenzy-contracts

      - name: Run Static Security Analysis
        run: cargo clippy --all-targets
        working-directory: ./frenzy-contracts

      - name: Run Adversarial Test Suite
        run: anchor test
        working-directory: ./frenzy-contracts