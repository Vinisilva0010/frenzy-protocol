[package]
name = "frenzy_vault"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
bytemuck = { version = "1.19.0", features = ["min_const_generics"] }

[dev-dependencies]
solana-program-test = "2.0.0"
solana-sdk = "2.0.0"