[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
frenzy_vault = "BLafEMNRKAimMcisFEpUg8oZuCKSSNaujdQf7moNpFyx"

[programs.localnet]
frenzy_vault = "BLafEMNRKAimMcisFEpUg8oZuCKSSNaujdQf7moNpFyx"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
handover = "npx ts-node tests/handover.ts"
setup = "npx ts-node tests/setup.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false
